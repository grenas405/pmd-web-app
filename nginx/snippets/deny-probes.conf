# Deploy to /etc/nginx/snippets/deny-probes.conf, then add
#   include snippets/deny-probes.conf;
# inside each HTTPS server block that should use it.
#
# No PHP/WordPress runs on this server — close the connection (444: no
# response at all) on scanner probes for those stacks.
# Keep these requests logged: fail2ban reads the access log to ban the
# source IP (see fail2ban/ in this repo).
location ~* \.(php|phtml|asp|aspx|jsp|cgi)$ { return 444; }
location ~* ^/(wp-admin|wp-includes|wp-content|wp-login|xmlrpc\.php|phpmyadmin) { return 444; }
location ~* ^/\.(git|env) { return 444; }
